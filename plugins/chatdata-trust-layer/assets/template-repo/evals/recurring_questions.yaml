eval_schema_version: 2

failure_layers:
  - missing_asset
  - retrieval_miss
  - context_conflict
  - application_error
  - query_error
  - source_data_error

context_metrics:
  - retrieval_recall
  - context_precision
  - application_rate
  - answer_correctness_given_successful_retrieval

ablation_metrics:
  - correct_answer_rate_delta
  - clarification_accuracy_delta
  - quietly_wrong_rate_delta
  - tokens_delta
  - latency_delta
  - source_calls_delta

production_correctness_labels:
  - online_correct
  - quietly_wrong
  - correct_clarification
  - correct_review
  - correct_refusal

context_oracles:
  conversion_drop:
    expected_route_id: self-serve-conversion-drop
    expected_metric_id: self_serve_conversion
    required_filters:
      - weekly business review period
      - exclude test accounts
      - exclude partner-assisted sessions
    expected_caveats:
      - campaign tagging changed during the same period
      - traffic quality should be reviewed before calling this purely a product issue
    validation_reference: weekly-dashboard-self-serve-conversion
    accepted_answer_states: [verified]
    required_context_ids:
      - metrics/self_serve_conversion
      - answer-paths/why-did-self-serve-conversion-drop
      - artifacts/weekly-dashboard-self-serve-conversion
      - queries/trusted/self_serve_conversion_wbr
    eligible_context_ids:
      - metrics/self_serve_conversion
      - metrics/contracts
      - answer-paths/why-did-self-serve-conversion-drop
      - answer-paths/which-segment-drove-change
      - answer-paths/is-this-movement-real-or-data-issue
      - artifacts/weekly-dashboard-self-serve-conversion
      - queries/trusted/self_serve_conversion_wbr
      - sources/domain-reference-template
    retrieved_context_ids: []
    applied_context_ids: []
    failure_layer: []
    ablation_bundle_ids:
      - governed_metric_packet
      - reviewed_answer_path
      - verified_dashboard_tieout
      - supporting_domain_context
    production_audit_sample_rate: 0.1
    production_audit_risk_tier: wbr_operating

  data_issue:
    expected_route_id: movement-real-or-data-issue
    expected_metric_id: self_serve_conversion
    required_filters:
      - weekly business review period
      - exclude test accounts
    expected_caveats:
      - dashboard tie-out passes, but attribution confidence is softened by tagging drift
    validation_reference: weekly-dashboard-self-serve-conversion
    accepted_answer_states: [verified]
    required_context_ids:
      - metrics/self_serve_conversion
      - answer-paths/is-this-movement-real-or-data-issue
      - artifacts/weekly-dashboard-self-serve-conversion
      - queries/trusted/self_serve_conversion_wbr
    eligible_context_ids:
      - metrics/self_serve_conversion
      - answer-paths/is-this-movement-real-or-data-issue
      - answer-paths/why-did-self-serve-conversion-drop
      - artifacts/weekly-dashboard-self-serve-conversion
      - artifacts/trusted_artifacts
      - queries/trusted/self_serve_conversion_wbr
    retrieved_context_ids: []
    applied_context_ids: []
    failure_layer: []
    ablation_bundle_ids:
      - governed_metric_packet
      - reviewed_data_quality_answer_path
      - verified_dashboard_tieout
    production_audit_sample_rate: 0.1
    production_audit_risk_tier: wbr_operating

  segment_driver:
    expected_route_id: segment-driver
    expected_metric_id: self_serve_conversion
    required_filters:
      - weekly business review period
      - exclude test accounts
    expected_caveats:
      - mobile paid search is the largest driver in the current synthetic export
      - campaign tagging changed during the same period
    validation_reference: weekly-dashboard-self-serve-conversion
    accepted_answer_states: [verified, trusted]
    required_context_ids:
      - metrics/self_serve_conversion
      - answer-paths/which-segment-drove-change
      - artifacts/weekly-dashboard-self-serve-conversion
      - queries/trusted/self_serve_conversion_wbr
    eligible_context_ids:
      - metrics/self_serve_conversion
      - answer-paths/why-did-self-serve-conversion-drop
      - answer-paths/which-segment-drove-change
      - answer-paths/mobile-paid-search-follow-up
      - artifacts/weekly-dashboard-self-serve-conversion
      - queries/trusted/self_serve_conversion_wbr
      - sources/domain-reference-template
    retrieved_context_ids: []
    applied_context_ids: []
    failure_layer: []
    ablation_bundle_ids:
      - governed_metric_packet
      - reviewed_segment_answer_path
      - verified_dashboard_tieout
    production_audit_sample_rate: 0.1
    production_audit_risk_tier: wbr_operating

  mobile_paid_search:
    expected_route_id: mobile-paid-search-follow-up
    expected_metric_id: self_serve_conversion
    required_filters:
      - weekly business review period
      - mobile paid search
    expected_caveats:
      - this path starts exploratory because the follow-up cut depends on the current campaign routing snapshot
    validation_reference: mobile-paid-search-benchmark-needed
    accepted_answer_states: [draft, benchmarked, needs_review]
    required_context_ids:
      - metrics/self_serve_conversion
      - answer-paths/mobile-paid-search-follow-up
      - queries/generated/mobile_paid_search_mix
    eligible_context_ids:
      - metrics/self_serve_conversion
      - answer-paths/mobile-paid-search-follow-up
      - answer-paths/which-segment-drove-change
      - queries/generated/mobile_paid_search_mix
      - sources/domain-reference-template
    retrieved_context_ids: []
    applied_context_ids: []
    failure_layer: []
    ablation_bundle_ids:
      - governed_metric_packet
      - exploratory_answer_path
      - supporting_domain_context
    production_audit_sample_rate: 0.05
    production_audit_risk_tier: exploratory_follow_up

